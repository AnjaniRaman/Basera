services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: basera, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}", POSTGRES_DB: basera }
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U basera"], interval: 5s, retries: 10 }
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: "postgres://basera:${POSTGRES_PASSWORD}@db:5432/basera"
      OTP_PROVIDER: "${OTP_PROVIDER:-console}"
      MSG91_AUTH_KEY: "${MSG91_AUTH_KEY:-}"
      MSG91_TEMPLATE_ID: "${MSG91_TEMPLATE_ID:-}"
      TRUST_PROXY: "1"
    ports: ["4000:4000"]
volumes: { dbdata: {} }
