# One-click deploy on Render: https://render.com/deploy?repo=https://github.com/AnjaniRaman/Basera
# Creates the web service (API + web app in one container) and a managed PostgreSQL database.
services:
  - type: web
    name: basera
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: basera-db, property: connectionString }
      - { key: NODE_ENV, value: production }
      - { key: TRUST_PROXY, value: "1" }
      - { key: SERVE_FRONTEND, value: "1" }
      - { key: CORS_ORIGIN, value: "*" }
      # Switch to msg91 (or twilio / webhook) once you have an SMS account; until then codes appear in the Render log.
      - { key: OTP_PROVIDER, value: console }
      - { key: MSG91_AUTH_KEY, sync: false }
      - { key: MSG91_TEMPLATE_ID, sync: false }
      - { key: MSG91_SENDER, sync: false }
      - { key: MAX_UPLOAD_BYTES, value: "5242880" }
databases:
  - name: basera-db
    plan: free
    region: singapore
