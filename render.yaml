services:
  - type: web
    name: basera
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - { key: DATABASE_URL, fromDatabase: { name: basera-db, property: connectionString } }
      - { key: OTP_PROVIDER, value: msg91 }
      - { key: MSG91_AUTH_KEY, sync: false }
      - { key: MSG91_TEMPLATE_ID, sync: false }
      - { key: TRUST_PROXY, value: "1" }
databases:
  - name: basera-db
    plan: basic-256mb
