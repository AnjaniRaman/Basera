name: Build apps

# Builds the installable apps from the same web code:
#   android  -> APK (debug-signed always; release-signed when the keystore secrets are set)
#   windows  -> NSIS installer + portable .exe
#   ios      -> compiles the Xcode project for the simulator (a device build needs your Apple signing on a Mac)
# Every run uploads its outputs under the "Artifacts" section of the run.

on:
  push:
    branches: ['**']
    paths:
      - 'frontend/**'
      - 'desktop/**'
      - 'shared/**'
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-apps.yml'
  workflow_dispatch:

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:locales
      - run: npm run build

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.APP_API_URL }}

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Restore release keystore (only when the secrets exist)
        working-directory: frontend/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
            echo "Release keystore restored."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: the release APK will be unsigned; use the debug APK for testing."
          fi

      - name: Build APKs
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_FILE: upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p out
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk "out/Basera-debug.apk"
          if [ -f frontend/android/app/build/outputs/apk/release/app-release.apk ]; then
            cp frontend/android/app/build/outputs/apk/release/app-release.apk "out/Basera-release.apk"
          elif [ -f frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk "out/Basera-release-unsigned.apk"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix desktop

      - name: Build web app
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.APP_API_URL }}

      - name: Build installer and portable exe
        working-directory: desktop
        run: npm run build:win

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            desktop/release/*.exe
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error

  ios:
    name: iOS (compile check)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.APP_API_URL }}

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync ios

      - name: Build for the simulator (no signing)
        working-directory: frontend/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -derivedDataPath build | tail -40
          ls build/Build/Products/Debug-iphonesimulator

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: frontend/ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: warn
